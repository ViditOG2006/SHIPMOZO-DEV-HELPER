# Render Web Service (native Node) — NOT Docker.
# If you see "registry cache importer / buildcache: not found", your Render service
# is still on Docker runtime. Delete it and recreate as Node (steps below).
#
# Dashboard → New → Web Service (NOT Docker):
#   Runtime: Node | Build: npm run build:render (or npm ci for deps-only) | Start: node server.js
# No Dockerfile at repo root — Render auto-detects Docker if Dockerfile exists.
services:
  - type: web
    name: shipmozo-dev-helper
    runtime: node
    plan: free
    buildCommand: npm run build:render
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: HEADLESS
        value: "true"
      - key: PYTHON_BIN
        value: python3
      - key: PUBLIC_TUNNEL
        value: "false"
      - key: PUBLIC_BASE_URL
        value: https://shipmozo-dev-helper-1.onrender.com
      - key: IMAGE_STORAGE
        value: cloudinary
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SHIPMOZO_EMAIL
        sync: false
      - key: SHIPMOZO_PASSWORD
        sync: false
      - key: POSTMAN_API_KEY
        sync: false
      - key: POSTMAN_COLLECTION_ID
        sync: false
