<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shipmozo Dev Helper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f1f5f9;
        --surface: #ffffff;
        --surface-raised: #ffffff;
        --sidebar: #0f172a;
        --sidebar-border: #1e293b;
        --sidebar-text: #94a3b8;
        --sidebar-text-active: #f8fafc;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --accent-soft: #eff6ff;
        --text: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --border: #e2e8f0;
        --border-strong: #cbd5e1;
        --success: #059669;
        --success-bg: #ecfdf5;
        --error: #dc2626;
        --error-bg: #fef2f2;
        --warning: #d97706;
        --warning-bg: #fffbeb;
        --info: #2563eb;
        --info-bg: #eff6ff;
        --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
        --shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
        --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.05);
        --radius: 10px;
        --radius-sm: 6px;
        --radius-lg: 14px;
        --sidebar-width: 248px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      /* ── App shell ── */
      .app-shell {
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        width: var(--sidebar-width);
        flex-shrink: 0;
        background: var(--sidebar);
        border-right: 1px solid var(--sidebar-border);
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 100;
      }

      .sidebar-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 20px 18px;
        border-bottom: 1px solid var(--sidebar-border);
      }

      .brand-icon {
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, #2563eb, #0ea5e9);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        flex-shrink: 0;
      }

      .brand-title {
        font-weight: 700;
        font-size: 15px;
        color: #f8fafc;
        letter-spacing: -0.02em;
      }

      .brand-sub {
        font-size: 11px;
        color: var(--sidebar-text);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-top: 1px;
      }

      .sidebar-nav {
        flex: 1;
        padding: 12px 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 10px 12px;
        border: none;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--sidebar-text);
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        text-align: left;
        transition: background 0.15s, color 0.15s;
      }

      .nav-item:hover {
        background: var(--sidebar-border);
        color: var(--sidebar-text-active);
      }

      .nav-item.active {
        background: rgba(37, 99, 235, 0.2);
        color: #93c5fd;
      }

      .nav-item .nav-icon {
        width: 18px;
        text-align: center;
        font-size: 14px;
        opacity: 0.85;
      }

      .sidebar-footer {
        padding: 14px 16px;
        border-top: 1px solid var(--sidebar-border);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 500;
        color: var(--sidebar-text);
        padding: 4px 0;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .status-dot.ok { background: #34d399; box-shadow: 0 0 0 2px rgba(52, 211, 153, 0.25); }
      .status-dot.busy { background: #fbbf24; animation: pulse 1.5s infinite; }
      .status-dot.err { background: #f87171; }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      .main-content {
        flex: 1;
        margin-left: var(--sidebar-width);
        padding: 28px 32px 40px;
        max-width: 1100px;
      }

      .page-header {
        margin-bottom: 24px;
      }

      .page-header h1 {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: var(--text);
      }

      .page-header .subtitle {
        margin: 0;
        color: var(--text-muted);
        font-size: 14px;
      }

      /* ── Cards ── */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        padding: 20px 22px;
        margin-bottom: 16px;
      }

      .card h2 {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .card h3 {
        margin: 0 0 12px;
        font-size: 14px;
        font-weight: 600;
      }

      .card-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .card-header h2,
      .card-header h3 {
        margin: 0;
      }

      /* ── Alerts ── */
      .alert {
        border-radius: var(--radius);
        padding: 12px 16px;
        margin-bottom: 16px;
        font-size: 13px;
        border: 1px solid;
      }

      .alert strong {
        font-weight: 600;
      }

      .server-alert,
      .alert-error {
        background: var(--error-bg);
        border-color: #fecaca;
        color: #991b1b;
      }

      .alert-success {
        background: var(--success-bg);
        border-color: #a7f3d0;
        color: #065f46;
      }

      .alert-info {
        background: var(--info-bg);
        border-color: #bfdbfe;
        color: #1e40af;
      }

      .alert-warning {
        background: var(--warning-bg);
        border-color: #fde68a;
        color: #92400e;
      }

      .server-alert a,
      .alert a {
        color: var(--accent);
        font-weight: 500;
      }

      /* ── Buttons ── */
      button {
        border: 0;
        border-radius: var(--radius-sm);
        padding: 8px 14px;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        transition: background 0.15s, opacity 0.15s, transform 0.1s;
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      button:not(:disabled):active {
        transform: scale(0.98);
      }

      .primary {
        background: var(--accent);
        color: white;
      }

      .primary:not(:disabled):hover {
        background: var(--accent-hover);
      }

      .muted {
        background: var(--bg);
        color: var(--text-secondary);
        border: 1px solid var(--border);
      }

      .muted:not(:disabled):hover {
        background: var(--border);
      }

      .danger {
        background: #fef2f2;
        color: var(--error);
        border: 1px solid #fecaca;
      }

      .danger:not(:disabled):hover {
        background: #fee2e2;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .toolbar button {
        margin-right: 0;
      }

      /* ── Nav tabs (in-card) ── */
      .main-nav { margin-bottom: 0; }

      .nav-tabs {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        align-items: center;
        background: var(--bg);
        padding: 4px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
      }

      .nav-tabs button {
        background: transparent;
        border: none;
        color: var(--text-muted);
        padding: 7px 14px;
        border-radius: 4px;
        margin-right: 0;
      }

      .nav-tabs button:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.6);
      }

      .nav-tabs button.active {
        background: var(--surface);
        color: var(--accent);
        box-shadow: var(--shadow-sm);
        font-weight: 600;
      }

      /* ── Forms ── */
      label.field {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-top: 14px;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      label.field:first-of-type {
        margin-top: 0;
      }

      input[type="password"],
      input[type="text"],
      select,
      textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        box-sizing: border-box;
        font-family: inherit;
        font-size: 14px;
        color: var(--text);
        background: var(--surface);
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      textarea {
        min-height: 90px;
        resize: vertical;
        line-height: 1.5;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
        font-size: 13px;
        color: var(--text-secondary);
        cursor: pointer;
      }

      .checkbox-row input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .hint {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 6px;
        line-height: 1.5;
      }

      .hint code,
      code {
        font-family: "Consolas", "SF Mono", monospace;
        font-size: 12px;
        background: var(--bg);
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid var(--border);
      }

      /* ── Status text ── */
      .status { font-weight: 500; font-size: 13px; }
      .status.ok { color: var(--success); }
      .status.err { color: var(--error); }
      .status.info { color: var(--info); }

      /* ── Badges ── */
      .badge {
        display: inline-flex;
        align-items: center;
        background: var(--accent-soft);
        color: var(--accent);
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        padding: 3px 10px;
        margin-right: 6px;
        letter-spacing: 0.02em;
      }

      .badge-muted {
        background: var(--bg);
        color: var(--text-muted);
        border: 1px solid var(--border);
      }

      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }

      /* ── Chat ── */
      .chat-card {
        display: flex;
        flex-direction: column;
      }

      .chat-log {
        flex: 1;
        max-height: 520px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        background: var(--bg);
        margin-bottom: 14px;
        scroll-behavior: smooth;
      }

      .chat-msg {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
        align-items: flex-start;
      }

      .chat-msg:last-child {
        margin-bottom: 0;
      }

      .chat-avatar {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        flex-shrink: 0;
        letter-spacing: -0.02em;
      }

      .chat-msg.user .chat-avatar {
        background: var(--accent);
        color: white;
      }

      .chat-msg.assistant .chat-avatar {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text-muted);
      }

      .chat-bubble {
        flex: 1;
        min-width: 0;
        padding: 12px 14px;
        border-radius: var(--radius);
        font-size: 14px;
        line-height: 1.55;
        border: 1px solid var(--border);
        background: var(--surface);
      }

      .chat-msg.user .chat-bubble {
        background: var(--accent-soft);
        border-color: #bfdbfe;
      }

      .chat-msg .role {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        margin-bottom: 6px;
      }

      .chat-meta {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
        font-size: 11px;
        color: var(--text-muted);
      }

      .chat-composer {
        border-top: 1px solid var(--border);
        padding-top: 14px;
        margin-top: 4px;
      }

      .chat-composer textarea {
        min-height: 72px;
        margin-bottom: 8px;
      }

      /* ── Markdown ── */
      .markdown-body {
        font-size: 14px;
        line-height: 1.6;
        overflow-x: auto;
        color: var(--text);
      }

      .markdown-body.docs-preview {
        overflow-x: auto;
        overflow-y: visible;
        max-width: 100%;
        padding: 4px 2px 12px;
      }

      .markdown-body.docs-preview > :first-child {
        margin-top: 0;
      }

      .markdown-body.docs-preview p {
        margin: 0.65em 0;
      }

      .markdown-body.docs-preview blockquote {
        margin: 12px 0;
        padding: 10px 14px;
        border-left: 4px solid var(--accent);
        background: var(--bg);
        color: var(--text-secondary);
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      }

      .markdown-body.docs-preview hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 20px 0;
      }

      .docs-source-view {
        margin: 0;
        padding: 14px 16px;
        background: #f8fafc;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-family: "Consolas", "SF Mono", "Cascadia Code", monospace;
        font-size: 12px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
        overflow-x: auto;
        max-height: 70vh;
      }

      .docs-source-view code {
        font-family: inherit;
        background: transparent;
        color: inherit;
        border: none;
        padding: 0;
      }

      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3 {
        margin-top: 1.2em;
        margin-bottom: 0.5em;
        letter-spacing: -0.02em;
      }

      .markdown-body h1 { font-size: 1.4em; }
      .markdown-body h2 { font-size: 1.2em; }
      .markdown-body h3 { font-size: 1.05em; }

      .markdown-body pre {
        background: #1e293b;
        color: #e2e8f0;
        padding: 14px 16px;
        border-radius: var(--radius-sm);
        overflow-x: auto;
        font-size: 12px;
        line-height: 1.55;
        border: 1px solid #334155;
        margin: 12px 0;
      }

      .markdown-body pre code {
        font-family: "Consolas", "SF Mono", "Cascadia Code", monospace;
        font-size: 12px;
        background: transparent !important;
        color: inherit !important;
        border: none !important;
        padding: 0 !important;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .markdown-body code {
        font-family: "Consolas", "SF Mono", monospace;
        font-size: 13px;
      }

      .markdown-body :not(pre) > code {
        background: #f1f5f9;
        color: #0f172a;
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid var(--border);
      }

      .markdown-body .mermaid {
        display: block;
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 20px;
        margin: 14px 0;
        overflow-x: auto;
        text-align: center;
        min-height: 48px;
      }

      .markdown-body .mermaid.mermaid-rendered {
        visibility: visible;
        opacity: 1;
      }

      .markdown-body .mermaid svg {
        max-width: 100%;
        height: auto;
      }

      .markdown-body .mermaid.mermaid-error {
        text-align: left;
        background: #fff7ed;
        border-color: #fdba74;
        padding: 14px 16px;
      }

      .markdown-body .mermaid-fallback-wrap {
        text-align: left;
      }

      .markdown-body .mermaid-fallback {
        margin: 8px 0 0;
        padding: 12px;
        background: #fff;
        border-radius: 6px;
        font-size: 12px;
        text-align: left;
        overflow-x: auto;
        white-space: pre-wrap;
        border: 1px solid #fed7aa;
      }

      .markdown-body .mermaid-fallback-note {
        margin: 0;
        font-size: 13px;
        color: #9a3412;
        text-align: left;
      }

      .markdown-body .mermaid-fallback-details {
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
      }

      .markdown-body .mermaid-fallback-details summary {
        cursor: pointer;
        user-select: none;
      }

      .markdown-body .mermaid-invalid-note {
        margin: 6px 0 12px;
        font-size: 12px;
        color: var(--muted);
      }

      .markdown-body .mermaid-code-fallback {
        margin: 14px 0;
      }

      /* Mermaid render sandbox — off-screen only, never in-document diagrams */
      body > .mermaid-sandbox,
      body > div.mermaid-sandbox[id^="mermaid-"],
      body > div.mermaid-sandbox[id^="dmermaid-"] {
        position: absolute !important;
        left: -9999px !important;
        top: 0 !important;
        width: 1px !important;
        height: 1px !important;
        overflow: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        z-index: -1 !important;
      }

      .markdown-body .markdown-video {
        margin: 14px 0;
      }

      .markdown-body .markdown-video video {
        display: block;
        width: 100%;
        max-height: 360px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: #0f172a;
      }

      .markdown-body .markdown-video figcaption {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 6px;
      }

      .markdown-body table {
        border-collapse: collapse;
        width: 100%;
        margin: 12px 0;
        font-size: 13px;
        display: block;
        overflow-x: auto;
      }

      .markdown-body th,
      .markdown-body td {
        border: 1px solid var(--border);
        padding: 8px 12px;
        text-align: left;
      }

      .markdown-body th {
        background: var(--bg);
        font-weight: 600;
      }

      .markdown-body img {
        max-width: 100%;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        margin: 10px 0;
        box-shadow: var(--shadow-sm);
      }

      .markdown-body ul,
      .markdown-body ol {
        padding-left: 1.4em;
      }

      /* ── Screenshots grid ── */
      .screens-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 14px;
      }

      .screens-grid figure {
        margin: 0;
      }

      .screens-grid img {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        transition: box-shadow 0.15s;
      }

      .screens-grid img:hover {
        box-shadow: var(--shadow);
      }

      .screens-grid figcaption {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 6px;
        font-weight: 500;
      }

      /* ── Reports list ── */
      .report-list {
        list-style: none;
        padding: 0;
        margin: 12px 0 0;
      }

      .report-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        margin-bottom: 8px;
        background: var(--bg);
        transition: border-color 0.15s;
      }

      .report-item:hover {
        border-color: var(--border-strong);
      }

      .report-item-info {
        flex: 1;
        min-width: 0;
      }

      .report-item-title {
        font-weight: 600;
        font-size: 13px;
        color: var(--text);
      }

      .report-item-meta {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 2px;
      }

      .report-item-actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }

      .report-item-actions button {
        padding: 6px 10px;
        font-size: 12px;
      }

      /* ── Search hit ── */
      .search-hit {
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        margin-bottom: 10px;
        background: var(--bg);
      }

      .search-hit-header {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-muted);
        margin-bottom: 8px;
      }

      /* ── Empty state ── */
      .empty-state {
        text-align: center;
        padding: 32px 20px;
        color: var(--text-muted);
      }

      .empty-state-icon {
        font-size: 32px;
        margin-bottom: 10px;
        opacity: 0.5;
      }

      /* ── Step progress (docs) ── */
      .step-progress {
        display: flex;
        gap: 8px;
        margin: 16px 0 0;
        flex-wrap: wrap;
      }

      .step-chip {
        font-size: 11px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--bg);
        color: var(--text-muted);
        border: 1px solid var(--border);
      }

      .step-chip.active {
        background: var(--accent-soft);
        color: var(--accent);
        border-color: #bfdbfe;
      }

      .step-chip.done {
        background: var(--success-bg);
        color: var(--success);
        border-color: #a7f3d0;
      }

      /* ── Settings grid ── */
      .settings-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 4px 12px;
        margin-bottom: 8px;
      }

      .advanced-fields {
        padding: 16px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }

      .coverage-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .scenario-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .scenario-card {
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--bg);
        overflow: hidden;
      }

      .scenario-card summary {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        cursor: pointer;
        font-size: 13px;
        list-style: none;
      }

      .scenario-card summary::-webkit-details-marker {
        display: none;
      }

      .scenario-id {
        font-family: "Consolas", monospace;
        font-size: 11px;
        font-weight: 600;
        color: var(--accent);
      }

      .scenario-title {
        flex: 1;
        font-weight: 600;
        min-width: 160px;
      }

      .scenario-body {
        padding: 0 14px 14px;
        font-size: 13px;
        border-top: 1px solid var(--border);
        background: var(--surface);
      }

      .scenario-body ul,
      .scenario-body ol {
        margin: 8px 0;
        padding-left: 1.4em;
      }

      .scenario-pre {
        background: #0f172a;
        color: #e2e8f0;
        padding: 12px;
        border-radius: var(--radius-sm);
        font-size: 11px;
        overflow-x: auto;
        margin: 8px 0;
      }

      .scenario-pre-large {
        max-height: 480px;
        overflow: auto;
      }

      .status-pass {
        background: var(--success-bg);
        color: var(--success);
        border: 1px solid #a7f3d0;
      }

      .status-fail {
        background: var(--error-bg);
        color: var(--error);
        border: 1px solid #fecaca;
      }

      .status-skip {
        background: var(--warning-bg);
        color: var(--warning);
        border: 1px solid #fde68a;
      }

      .run-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 12px 0;
      }

      .run-summary .stat {
        padding: 10px 16px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--bg);
        font-size: 13px;
      }

      .run-summary .stat strong {
        display: block;
        font-size: 20px;
        line-height: 1.2;
      }

      .result-row {
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 12px 14px;
        margin-bottom: 8px;
        background: var(--surface);
      }

      .result-row.passed { border-left: 4px solid var(--success); }
      .result-row.failed { border-left: 4px solid var(--error); }
      .result-row.skipped { border-left: 4px solid var(--warning); }

      .run-console {
        background: #0f172a;
        color: #e2e8f0;
        font-family: "Consolas", "SF Mono", monospace;
        font-size: 12px;
        line-height: 1.55;
        padding: 14px 16px;
        border-radius: var(--radius-sm);
        max-height: 320px;
        overflow-y: auto;
      }

      .run-console-line {
        white-space: pre-wrap;
        word-break: break-word;
      }

      .run-progress-bar {
        height: 6px;
        background: var(--border);
        border-radius: 999px;
        overflow: hidden;
        margin: 12px 0;
      }

      .heal-modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: rgba(15, 23, 42, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .heal-modal {
        width: min(520px, 100%);
        max-height: 80vh;
        overflow: auto;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }

      .heal-console {
        max-height: 220px;
        margin-top: 12px;
      }

      .sheet-table-wrap {
        overflow: auto;
        max-height: 520px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
      }

      .sheet-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      .sheet-table th,
      .sheet-table td {
        border: 1px solid var(--border);
        padding: 8px 10px;
        text-align: left;
        vertical-align: top;
        min-width: 90px;
        max-width: 280px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .sheet-table th {
        background: var(--surface-elevated, #f1f5f9);
        position: sticky;
        top: 0;
        z-index: 1;
        font-weight: 600;
      }

      .run-progress-fill {
        height: 100%;
        background: var(--accent);
        transition: width 0.3s ease;
      }

      @media (max-width: 640px) {
        .settings-grid {
          grid-template-columns: 1fr;
        }
      }

      /* ── Legacy container (unused but safe) ── */
      .container {
        max-width: none;
        margin: 0;
        padding: 0;
      }

      .subtitle {
        margin: 0;
        color: var(--text-muted);
        font-size: 14px;
      }

      h1, h2 { margin-top: 0; }

      .example-links {
        margin: 8px 0 0;
        padding-left: 20px;
        font-size: 13px;
      }

      .example-links a {
        color: var(--accent);
        font-weight: 500;
      }

      /* ── Responsive ── */
      @media (max-width: 768px) {
        .sidebar {
          width: 100%;
          position: relative;
          height: auto;
        }

        .main-content {
          margin-left: 0;
          padding: 16px;
        }

        .app-shell {
          flex-direction: column;
        }

        .sidebar-nav {
          flex-direction: row;
          flex-wrap: wrap;
          padding: 8px;
        }

        .nav-item {
          flex: 1;
          min-width: 120px;
          justify-content: center;
        }

        .sidebar-footer {
          display: none;
        }
      }
    </style>
  </head>

        });
